<!-- base.html: 모든 페이지가 공통으로 상속받는 "뼈대" 템플릿 -->
<!-- 다른 페이지들(home_ko.html, about_ko.html 등)은 extends "base.html" 태그로 -->
<!-- 이 파일을 부모로 삼고, block 태그로 표시된 빈 칸만 채워 넣어서 완성된다 -->
<!-- (주의: 이 주석 안에서는 실제 Jinja 태그처럼 중괄호-퍼센트 기호를 쓰지 않는다. -->
<!--  HTML 주석 안에 있어도 Jinja는 그 기호를 그대로 해석해버리기 때문이다) -->
<!DOCTYPE html>
<!-- lang 변수는 Flask 라우트에서 넘겨주는 값(ko/en/ja)으로, -->
<!-- 페이지 언어가 무엇인지 브라우저/검색엔진에 알려주는 역할을 한다 -->
<html lang="{{ lang }}">
<head>
  <!-- include 태그는 다른 템플릿 파일의 내용을 이 자리에 그대로 끼워 넣는 문법 -->
  <!-- head.html에는 meta 태그, title 블록, 공통 CSS 링크들이 들어있다 -->
  {% include 'partials/layout/head.html' %}
  <!-- page_css는 페이지마다 추가로 필요한 CSS만 덧붙일 수 있도록 비워둔 블록 -->
  <!-- (기본값은 비어있고, 자식 페이지가 필요할 때만 이 블록을 채운다) -->
  {% block page_css %}{% endblock %}
</head>

<body>

  <!-- ============================================ -->
  <!-- 로딩 오버레이: 페이지 전체를 덮는 레이어 -->
  <!-- 처음엔 배경색만 덮고 있다가(로딩 애니메이션은 숨김), -->
  <!-- 2초가 지나도 아직 로딩 중이면 그때 로딩 애니메이션이 나타난다 -->
  <!-- 로딩이 끝나면 이 오버레이 자체가 사라지면서 실제 콘텐츠가 드러난다 -->
  <!-- (동작을 제어하는 스크립트는 static/js/page_loader.js) -->
  <!-- ============================================ -->
  <div id="page-loader">
    <div class="loader-spinner"></div>
  </div>

  <!-- 모든 페이지 상단에 공통으로 뜨는 헤더(로고 + 메뉴)를 끼워 넣는다 -->
  {% include 'partials/layout/header.html' %}

  <main>
    <!-- content 블록: 각 페이지의 실제 본문 내용이 채워지는 자리. -->
    <!-- 자식 템플릿에서 block content ... endblock 으로 이 부분을 덮어쓴다 -->
    {% block content %}{% endblock %}
  </main>

  <!-- 화면 한쪽에 떠 있는 한국어/Eng/日本語 언어 전환 버튼 -->
  {% include 'partials/layout/lang_switcher.html' %}

  <!-- 페이지 맨 아래 공통 푸터(저작권 표시, 이메일 링크) -->
  {% include 'partials/layout/footer.html' %}

  <!-- ============================================ -->
  <!-- 공통 스크립트 로드: body 맨 끝에 두는 이유는, -->
  <!-- 위쪽의 HTML 요소들이 먼저 화면에 그려진 뒤에 스크립트가 실행되게 해서 -->
  <!-- 페이지가 더 빨리 화면에 나타나는 것처럼 느껴지게 하기 위함이다 -->
  <!-- ============================================ -->
  <!-- 2초 넘게 로딩되면 스피너를 보여주고, 로딩이 끝나면 오버레이를 없애는 스크립트 -->
  <script src="{{ url_for('static', filename='js/page_loader.js') }}"></script>
  <!-- 태양 모양 커스텀 커서 + 마우스 잔상 효과. ?v=3은 캐시 무효화용 버전 쿼리(파일을 -->
  <!-- 수정했는데도 브라우저가 예전 버전을 캐시에서 그대로 쓰는 것을 막기 위한 트릭이다) -->
  <script src="{{ url_for('static', filename='js/custom_cursor.js') }}?v=3"></script>
  <!-- 메뉴에 마우스를 올렸을 때 무대 조명처럼 빛나는 효과 -->
  <script src="{{ url_for('static', filename='js/nav_spotlight.js') }}?v=3"></script>
</body>
</html>
