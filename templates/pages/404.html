<!-- 404.html: 존재하지 않는 페이지에 접속했을 때 보여주는 안내 화면 -->
<!-- extends 태그로 base.html의 구조(헤더/푸터/스크립트 등)를 그대로 물려받는다 -->
{% extends "base.html" %}
<!-- 이 페이지만의 제목으로 base.html의 title 블록을 덮어쓴다 -->
{% block title %}페이지를 찾을 수 없습니다{% endblock %}
<!-- base.html의 <main> 안 빈 칸(content 블록)에 아래 내용을 채워 넣는다 -->
{% block content %}
<section>
  <h1>404</h1>
  <p>요청하신 페이지를 찾을 수 없습니다.</p>
</section>
{% endblock %}
