<!-- lang_switcher.html                            -->
<!-- 한국어 / Eng / 日本語 언어 전환 버튼            -->
<!-- ⚠️ 지금은 임시로 간단하게 만든 버전.             -->
<!-- Stage 9에서 i18n_service.py의 switch_url() 함수로 제대로 다듬을 예정 -->
<!-- ============================================ -->

<div class="lang-switcher">

    <!-- request.path 는 Flask가 자동으로 제공하는 값으로 -->
    <!-- "지금 사용자가 보고 있는 주소의 경로"를 문자열로 담고 있다 -->
    <!-- 예: 지금 주소가 /ko/about 이면 request.path는 "/ko/about" -->
  
    <!-- request.path[3:] 는 파이썬(그리고 Jinja)의 "문자열 자르기" 문법 -->
    <!-- 앞의 3글자(예: "/ko")를 잘라내고 나머지("/about")만 남긴다 -->
    <!-- 그래서 "/ko" + "/about" 대신 "/ko" + request.path[3:] 로 -->
    <!-- 지금 보던 페이지는 유지한 채 언어만 바꿔서 이동시킬 수 있다 -->
    <a href="/ko{{ request.path[3:] }}">한국어</a>
    <a href="/en{{ request.path[3:] }}">Eng</a>
    <a href="/ja{{ request.path[3:] }}">日本語</a>
  
  </div>
