<!-- lang_switcher.html                            -->
<!-- 한국어 / Eng / 日本語 언어 전환 버튼            -->
<!-- ============================================ -->

<div class="lang-switcher">
    <!-- 세 링크 모두 no-trail 클래스 추가 -->
    <!-- 텍스트 위에 잔상이 겹쳐서 글씨가 가려지는 걸 방지 -->
    <!-- request.path[3:]는 현재 주소(request.path)에서 앞 3글자를 잘라내는 문법이다 -->
    <!-- 예: request.path가 "/ko/about"이면 [3:]은 "/ko"(3글자)를 잘라낸 나머지 "/about"만 남긴다 -->
    <!-- 그래서 지금이 "/ko/about"이든 "/en/about"이든, 언어 코드만 바꿔서 -->
    <!-- 같은 페이지의 다른 언어 버전으로 이동하는 링크가 만들어진다 -->
    <a href="/ko{{ request.path[3:] }}" class="no-trail">한국어</a>
    <a href="/en{{ request.path[3:] }}" class="no-trail">Eng</a>
    <a href="/ja{{ request.path[3:] }}" class="no-trail">日本語</a>
  </div>
